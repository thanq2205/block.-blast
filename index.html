<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Mini</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            background: #222;
            border: 4px solid #444;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Giao diện Màn hình Bắt đầu */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #start-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-green {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s ease;
        }

        .btn-green:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        /* Bảng hiển thị Điểm */
        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            z-index: 5;
        }

        /* Khu vực chơi game */
        #play-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Khối màu */
        .block {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        /* Màn hình Thua (Game Over) */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-screen h2 {
            font-size: 36px;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        #game-over-screen p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Hướng dẫn điều khiển dưới chân */
        #controls-hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Điểm số -->
        <div id="score-board">Điểm: <span id="score">0</span></div>

        <!-- Màn hình bắt đầu -->
        <div id="start-screen">
            <h1>BLOCK BLAST</h1>
            <button class="btn-green" id="start-btn">Bắt Đầu</button>
        </div>

        <!-- Vùng chơi chính -->
        <div id="play-area"></div>

        <!-- Hướng dẫn -->
        <div id="controls-hint">Dùng phím Mũi tên Trái / Phải để di chuyển khối</div>

        <!-- Màn hình Game Over -->
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>Điểm đạt được: <span id="final-score">0</span></p>
            <button class="btn-green" id="restart-btn">Chơi Lại</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const playArea = document.getElementById('play-area');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let gameInterval = null;
        let currentBlock = null;
        let isPlaying = false;
        let currentThemeIndex = 0;

        const themes = [
            ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#e67e22'], // Bộ màu 1
            ['#1abc9c', '#e84393', '#00cec9', '#fdcb6e', '#ff7675'], // Bộ màu 2 (Đổi khi đạt >= 5 điểm)
            ['#00b894', '#0984e3', '#6c5ce7', '#ffeaa7', '#d63031']  // Bộ màu 3
        ];

        // Lắng nghe sự kiện bấm nút Bắt Đầu
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            playArea.innerHTML = '';
            score = 0;
            scoreDisplay.textContent = score;
            currentThemeIndex = 0;
            isPlaying = true;
            spawnBlock();

            // Vòng lặp trò chơi rơi xuống
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 35); // Đã giảm tốc độ (tăng thời gian khung hình lên một chút)
        }

        // Tạo khối mới rơi từ trên xuống
        function spawnBlock() {
            if (!isPlaying) return;

            const block = document.createElement('div');
            block.classList.add('block');
            
            // Chọn ngẫu nhiên màu theo bảng màu hiện tại
            const activeColors = themes[currentThemeIndex];
            block.style.backgroundColor = activeColors[Math.floor(Math.random() * activeColors.length)];
            
            // Vị trí ngẫu nhiên theo chiều ngang
            let posX = Math.floor(Math.random() * 8) * 40;
            let posY = 0;

            block.style.left = posX + 'px';
            block.style.top = posY + 'px';

            playArea.appendChild(block);
            currentBlock = { element: block, x: posX, y: posY };
        }

        // Cập nhật vị trí khối rơi mỗi khung hình
        function updateGame() {
            if (!isPlaying || !currentBlock) return;

            currentBlock.y += 1.5; // Đã giảm tốc độ rơi của khối xuống (từ 3 xuống 1.5)
            currentBlock.element.style.top = currentBlock.y + 'px';

            // Khi khối chạm đáy màn hình (560 = 600 - 40)
            if (currentBlock.y >= 560) {
                score += 1;
                scoreDisplay.textContent = score;

                // Cứ đạt 5 điểm thì đổi sang bộ màu khác
                if (score % 5 === 0) {
                    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
                }

                // Xóa khối cũ và tạo khối mới
                currentBlock.element.remove();
                spawnBlock();
            }
        }

        // Điều khiển bằng bàn phím (Mũi tên Trái / Phải)
        window.addEventListener('keydown', (e) => {
            if (!isPlaying || !currentBlock) return;

            if (e.key === 'ArrowLeft' && currentBlock.x > 0) {
                currentBlock.x -= 40;
                currentBlock.element.style.left = currentBlock.x + 'px';
            } else if (e.key === 'ArrowRight' && currentBlock.x < 320) {
                currentBlock.x += 40;
                currentBlock.element.style.left = currentBlock.x + 'px';
            }
        });

        // Hàm kết thúc trò chơi
        function triggerGameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            if (currentBlock && currentBlock.element) {
                currentBlock.element.remove();
            }
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
